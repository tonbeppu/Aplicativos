name: Build Display APK e AAB

on:
  push:
    branches: [ main ]
    paths:
      - 'android-display-app/**'
      - '.github/workflows/build-display.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: android-display-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Restaurar keystore de release
        if: ${{ secrets.DISPLAY_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.DISPLAY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties << PROPS
          storeFile=../release.keystore
          storePassword=${{ secrets.DISPLAY_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.DISPLAY_KEY_ALIAS }}
          keyPassword=${{ secrets.DISPLAY_KEY_PASSWORD }}
          PROPS

      - name: Build APK (release)
        run: gradle assembleRelease --no-daemon

      - name: Build AAB (release)
        run: gradle bundleRelease --no-daemon

      - name: Renomear arquivos gerados
        run: |
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/MoveDados-display.apk
          cp app/build/outputs/bundle/release/*.aab app/build/outputs/bundle/release/MoveDados-display.aab

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MoveDados-display
          path: android-display-app/app/build/outputs/apk/release/MoveDados-display.apk

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: MoveDados-display-aab
          path: android-display-app/app/build/outputs/bundle/release/MoveDados-display.aab
