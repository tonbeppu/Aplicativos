name: Build APK e AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: android-driver-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK (release)
        run: gradle assembleRelease --no-daemon

      - name: Build AAB (release)
        run: gradle bundleRelease --no-daemon

      - name: Renomear arquivos gerados
        run: |
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/MoveDados-driver.apk
          cp app/build/outputs/bundle/release/*.aab app/build/outputs/bundle/release/MoveDados-driver.aab

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MoveDados-driver
          path: android-driver-app/app/build/outputs/apk/release/MoveDados-driver.apk

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: MoveDados-driver-aab
          path: android-driver-app/app/build/outputs/bundle/release/MoveDados-driver.aab
